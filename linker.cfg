MEMORY {
    HEADER:  start=$000000, size=$0000, fill=yes, fillval=$00;
    ROM:     start=$008000, size=$7F8000, fill=yes, fillval=$FF;
    WRAM:    start=$7E0000, size=$20000;
    ZEROPAGE: start=$000000, size=$0100;
}
SEGMENTS {
    CODE:    load=ROM,  type=ro;
    VECTORS: load=ROM,  start=$00FFEA, type=ro;
    ZEROPAGE: load=ZEROPAGE, type=zp;
}